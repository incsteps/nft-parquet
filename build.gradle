 * Learn more about Gradle by exploring our Samples at https://docs.gradle.org/8.13/samples
 */
plugins {
    // Apply the groovy Plugin to add support for Groovy.
    id 'groovy'
    id 'java-library'
}

repositories {
    mavenCentral()
}

dependencies{
    implementation 'com.jerolba:carpet-record:0.2.0'

    compileOnlyApi platform('org.apache.groovy:groovy-bom:4.0.26')
    compileOnlyApi 'org.apache.groovy:groovy'
    testImplementation platform("org.spockframework:spock-bom:2.3-groovy-4.0")
    testImplementation "org.spockframework:spock-core"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}

tasks.register('uberJar', Jar) {
    group 'build'
    archiveClassifier = ""

    from sourceSets.main.output

    dependsOn configurations.runtimeClasspath
    from {
        configurations.runtimeClasspath.findAll { it.name.endsWith('jar') }.collect { zipTree(it) }
    }

    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}
